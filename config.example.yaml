# Keys are never placed in this file, only env var names (api_key_env).
# Free-only: there are no paid modes, budgets, or paid policies. Paid settings are rejected.
# OpenRouter models must be "openrouter/free" or end in ":free" (anything else bills credits).
# Gemini and Groq stay free only while their accounts have no billing attached.
routing:
  max_fallback_attempts: 3
  large_context_min_tokens: 128000
  provider_order: [openrouter-free, gemini-free, groq-free]
  policies:
    # model_order is an ordered hard allowlist: only listed models are ever routed, in this order.
    # Placeholder IDs below (<...>) must be replaced with real API model IDs.
    openrouter-free: {provider: openrouter, model_order: [openrouter/free]}
    gemini-free:
      provider: gemini
      model_order: ["<gemini-flash-3.8-api-id>", "<gemini-flash-3.7-api-id>"]
    groq-free:
      provider: groq
      model_order: ["<groq-model-x-api-id>", "<groq-model-y-api-id>"]
providers:
  openrouter: {enabled: true, api_key_env: OPENROUTER_API_KEY}
  gemini:
    enabled: true
    api_key_env: GEMINI_API_KEY
    # Optional. Fill in numbers from your own provider dashboard; none are shipped here.
    # limits:
    #   - {dimension: requests_per_day, limit: <from your AI Studio dashboard>}
    #   - {dimension: requests_per_minute, limit: <from your AI Studio dashboard>, model: "<id>"}
    # models:
    #   "<model-id>": {supports_tool_calling: true, context_window: <tokens>}
  groq:       {enabled: true, api_key_env: GROQ_API_KEY}
discord:
  bot_token_env: DISCORD_BOT_TOKEN
  # Empty allowlists deny everyone: a command needs the user, guild AND channel to be listed.
  allowed_user_ids: []
  allowed_guild_ids: []
  allowed_channel_ids: []
opencode:
  # OpenCode never holds a provider key. The daemon launches `opencode serve` itself (managed_server)
  # with an inline config whose ONLY provider is the built-in loopback gateway; the gateway holds
  # the real keys and forwards allowlisted free models only (see `gateway:` below).
  server_url: http://127.0.0.1:4096   # only used when managed_server is false (tests/debug)
  managed_server: true     # false = tests/debug only, unsupported for production
  server_port: 4096        # 0 = pick a free port on each (re)start
  server_directory: /var/lib/broke-ai-coder/opencode-server   # cwd of `opencode serve`; must be writable by os_user, outside your home
  server_start_timeout_s: 30
  server_restart_max_backoff_s: 60   # crash restarts back off 1, 2, 4 ... up to this
  env_passthrough: []      # must stay empty with os_user sudo (sudo resets the environment); key/token-like names are rejected
  working_directory: /workspace
  command: [/usr/local/bin/opencode]   # absolute path required with os_user sudo; copied there in setup Part D1
  os_user:
    mode: sudo          # none = OpenCode runs as the daemon user: tests/Windows dev only, unsupported for production (R1)
    name: brokeoc       # dedicated user, see docs/SETUP-discord-opencode.md Part C6
    protected_paths: ["~/.config/broke-ai-coder/secrets.env", "/mnt/c"]  # must be unreadable by os_user
  # projects: {myproj: /workspace/myproj}   # extra project names for /code project:<name>
  run_timeout_s: 1800
  kill_grace_s: 5
  health_timeout_s: 5
  max_line_bytes: 1048576
  output_tail_chars: 4000
  stderr_tail_bytes: 4096
  continue_prompt: "Continue the previous task from where it stopped. Do not repeat steps that already completed."
  # SAFETY: the daemon pins model/small_model to broke/<provider>/<model> and enabled_providers to
  # ["broke"] via OPENCODE_CONFIG_CONTENT. Before each task GET /config must show exactly that,
  # `opencode auth` storage must be empty (delete brokeoc's auth.json, see docs/SETUP-discord-opencode.md E3), and project opencode.json /
  # .opencode/*.json files (project dir up to the filesystem root) must not contain provider,
  # enabled_providers or disabled_providers, or model keys outside broke/... Otherwise tasks fail
  # closed with OPENCODE_UNSAFE_CONFIG. Policy providers must be openrouter, gemini or groq.
gateway:
  port: 0                        # 127.0.0.1 only; 0 = ephemeral (the daemon tells OpenCode)
  max_request_bytes: 16777216    # reject larger request bodies (413)
  max_response_bytes: 33554432   # cap for non-streaming upstream bodies (502 if exceeded)
  max_error_body_bytes: 65536    # upstream error bodies are read only up to this size
  upstream_connect_timeout_s: 10
  upstream_read_timeout_s: 300   # max silence from the upstream while streaming
  max_concurrent_requests: 4     # simultaneous upstream calls
  small_model: null              # gateway model id "<provider>/<model>"; default = first allowlisted
orchestrator:
  provider_refresh_interval_s: 300
  progress_min_interval_s: 10
  session_idle_close_days: 7
  require_tool_calling: false
  small_model_check_ttl_s: 30   # cache a passing OpenCode server-config check
database:
  path: data/agent-controller.db
  busy_timeout_ms: 5000
  retention_days: 60
  cleanup_interval_hours: 24
  cleanup_batch_size: 500
runtime:
  task_queue_maxsize: 100
  event_queue_maxsize: 1000
  shutdown_timeout_s: 10
cooldown:
  rate_limit_default_s: 60
  provider_unavailable_s: 120
  network_failure_threshold: 3
  network_failure_window_s: 300
  network_failure_cooldown_s: 120
  max_cooldown_s: 3600
